<!doctype html><html lang="en-US"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151419"><title>Game Room · Community Games</title><style>*{box-sizing:border-box}
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--app-height:100dvh;--paper:#14141a;--ink:#fffaf2;--muted:#c0bcc8;background:#0d0d12;color:var(--ink)}
body{margin:0;font-synthesis:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid #e0fc91;outline-offset:3px}
button:active{filter:brightness(.88)}
[hidden]{display:none!important}
.phone{margin:auto;max-width:1040px}
.menu{padding:max(26px,env(safe-area-inset-top)) max(17px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(17px,env(safe-area-inset-left));background:radial-gradient(ellipse at top left,#27242e 0,transparent 480px)}
.menuHeader{display:flex;align-items:center;gap:13px;margin:7px 0 21px}
.mark{display:grid;grid-template-columns:repeat(2,10px);gap:3px;align-content:center;justify-content:center;width:43px;height:43px;border-radius:13px;background:#dcfb85;transform:rotate(-6deg)}
.mark i{background:#222329;height:10px;border-radius:3px}.mark i:last-child{border-radius:100%;background:transparent;border:2px solid #222329}
h1{margin:0;font-size:clamp(35px,7vw,57px);line-height:.99;letter-spacing:-.065em;font-weight:850}
.gameFilters{display:flex;gap:7px;margin-bottom:16px}
.gameFilters button{border:1px solid #494650;border-radius:22px;min-height:44px;padding:0 15px;background:#1f1e25;color:#d8d5df;font-size:13px;font-weight:700}
.gameFilters button[aria-pressed=true]{background:#eeeae2;color:#16151c;border-color:#eeeae2}
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 11px}
.game{position:relative;align-self:stretch;display:flex;flex-direction:column;overflow:hidden;isolation:isolate;border:1px solid #3b3844;border-radius:16px;background:#211f28;padding:0;text-align:left;transition:transform .18s ease,filter .18s}
.game img{display:block;width:100%;aspect-ratio:1.72;object-fit:cover}
.cardBody{display:flex;flex:1;flex-direction:column;gap:5px;padding:12px 11px 13px}.cardBody strong{font-weight:780;letter-spacing:-.035em;line-height:1.06;font-size:clamp(17px,4.55vw,24px)}
.cardBody small{font-size:12px;line-height:1.35;color:#cbc6d1}
.game b{position:absolute;top:8px;right:8px;display:grid;place-items:center;width:27px;height:27px;border-radius:50%;background:#15131cc9;color:white;font-size:16px;font-weight:500}
.featured{grid-column:1/-1;min-height:185px;background:#291731}
.featured img{position:absolute;inset:0;height:100%;aspect-ratio:auto;object-position:50% 50%;z-index:-2}
.featured:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(80deg,#200f23ed 0%,#211024ba 37%,#1d112505 78%)}
.featured .cardBody{justify-content:flex-end;gap:6px;padding:20px;max-width:78%}
.featured strong{font-size:clamp(30px,7.3vw,49px);color:#fff9e9}.featured small{color:#fff3df;font-weight:600}
.game .resumeState{position:absolute;top:9px;left:9px;border-radius:8px;background:#18151deb;padding:4px 7px;color:#e7f9b0;font-size:10px;font-weight:750}
.player{display:flex;flex-direction:column;position:fixed;inset:0;margin:auto;width:100%;height:var(--app-height);background:var(--paper);padding-bottom:var(--safe-bottom,env(safe-area-inset-bottom));padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);overflow:hidden}
.bar{flex:none;display:grid;grid-template-columns:minmax(65px,1fr) auto minmax(65px,1fr);align-items:center;padding:env(safe-area-inset-top) 10px 0;background:#1b1a21;color:#faf8f3;border-bottom:1px solid #3b3942}
.bar button{justify-self:start;background:none;border:0;min-height:44px;padding:0 6px;font-size:13px;font-weight:650;color:#ddf99a}.bar #reset{justify-self:end}
 .bar{grid-template-columns:minmax(50px,1fr) minmax(0,auto) minmax(116px,1fr)}.gameTools{justify-self:end;display:flex;align-items:center;gap:2px}.bar .gameTools button{font-size:11px;padding:0 4px}.bar #soundToggle[aria-pressed=true]{color:#fff5cd}.bar strong{font-size:14px;line-height:1.1;text-align:center}
.player iframe{flex:1;min-height:0;width:100%;border:0;background:var(--paper)}
.resetDialog{color:var(--ink);background:#25232c;border:1px solid #686271;border-radius:18px;max-width:min(335px,90%);padding:19px}.resetDialog h2{margin:0;font-size:21px}.resetDialog p{color:#d7d1de}
.resetActions{display:flex;gap:10px;justify-content:flex-end}.resetActions button{min-height:44px;border:0;border-radius:12px;padding-inline:14px;background:#3b3843}.resetActions button:last-child{background:#ddfb8d;color:#171a0e;font-weight:700}.resetDialog::backdrop{background:#08070cbf}
@media(min-width:700px){.menu{padding:32px clamp(18px,4vw,50px) 60px}.list{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.featured{grid-column:span 2}.cardBody{padding:16px}.featured .cardBody{padding:22px}.player{max-width:820px}.player:is([data-active=forest],[data-active=fight],[data-active=pool]){max-width:1300px}}
@media(orientation:landscape) and (max-height:520px){.bar button{min-height:32px}.bar strong{font-size:12px}}
@media(hover:hover){.game:hover{transform:translateY(-2px);border-color:#a4a095}}

let activeKey=null,menuY=0;

function fitScreen(){
 const height=Math.floor(viewport?.height || window.innerHeight);
 const root=document.documentElement;
 if(!viewport||Math.abs(viewport.scale-1)<.02){
  root.style.setProperty('--app-height',height+'px');
  root.style.setProperty('--app-width',Math.floor(viewport?.width || window.innerWidth)+'px');
 }
 const frame=frames.get(activeKey);
 const input=frame?.contentDocument?.activeElement;
 const typing=input?.matches('input,textarea,[contenteditable="true"]');
 root.style.setProperty('--safe-bottom',typing?'0px':'env(safe-area-inset-bottom,0px)');
 if(typing&&input.getBoundingClientRect().bottom>frame.clientHeight-8){
  requestAnimationFrame(()=>{
   if(input===frame.contentDocument?.activeElement)input.scrollIntoView({block:'center'});
  });
 }
}

const liveGameTypes={3:'forest',7:'pool',8:'fight'};
function notifyVisibility(key,frame,active){
 const type=liveGameTypes[key];
 if(type)frame?.contentWindow.postMessage({type:type+'-visibility',active},'*');
}
function sendVisibility(key,frame,active){
 frame?.contentWindow.postMessage({type:'arcade-visibility',active},'*');
 notifyVisibility(key,frame,active);
}
function syncActive(){
 if(activeKey===null)return;
 sendVisibility(activeKey,frames.get(activeKey),!document.hidden&&!resetDialog.open);
}
function createFrame(key,title){
 const frame=document.createElement('iframe');
 frame.title=title;
 frames.set(key,frame);
 frame.addEventListener('load',()=>{
  frame.contentDocument.addEventListener('focusin',fitScreen);
  frame.contentDocument.addEventListener('focusout',()=>requestAnimationFrame(fitScreen));
  if(activeKey===key&&frames.get(key)===frame){fitScreen();syncActive()}
 });
 frame.src=games[key];
 player.append(frame);
 return frame;
}
function openGame(key){
 if(activeKey===null)menuY=window.scrollY;
 if(activeKey!==null&&activeKey!==key)sendVisibility(activeKey,frames.get(activeKey),false);
 const button=gameButtons[key],title=button.querySelector('strong').textContent;
 const frame=frames.get(key)||createFrame(key,title);
 activeKey=key;
 for(const other of frames.values())other.hidden=other!==frame;
 player.dataset.active=liveGameTypes[key]??'';
 document.querySelector('.bar strong').textContent=title;
 menu.hidden=true;
 player.hidden=false;
 window.scrollTo(0,0);
 fitScreen();
 syncActive();
}

for(const [key,button] of gameButtons.entries()){
 button.querySelector('b').setAttribute('aria-hidden','true');
 button.onclick=()=>openGame(key);
}
const filters=[...document.querySelectorAll('.gameFilters button')];
for(const button of filters)button.onclick=()=>{
 const kind=button.dataset.device;
 for(const b of filters)b.setAttribute('aria-pressed',String(b===button));
 for(const [key,card] of gameButtons.entries()){
  const landscapeOnly=key===3||key===8;
  card.hidden=kind==='wide'?!landscapeOnly&&key!==7:kind==='tall'&&landscapeOnly;
 }
};
document.querySelector('#back').onclick=()=>{
 if(activeKey===null)return;
 const key=activeKey,button=gameButtons[key];
 sendVisibility(key,frames.get(key),false);
 activeKey=null;
 player.hidden=true;
 menu.hidden=false;
 if(!button.querySelector('.resumeState')){
  const mark=document.createElement('span');
  mark.className='resumeState';
  mark.textContent='Resume';
  button.append(mark);
 }
 fitScreen();
 window.scrollTo(0,menuY);
 button.focus({preventScroll:true});
};
resetButton.onclick=()=>{
 if(activeKey===null||resetDialog.open)return;
 resetDialog.returnValue='';
 resetDialog.showModal();
 syncActive();
};
resetDialog.addEventListener('close',()=>{
 if(resetDialog.returnValue==='reset'&&activeKey!==null){
  const key=activeKey;
  frames.get(key)?.remove();
  frames.delete(key);
  openGame(key);
 }else syncActive();
});
document.querySelector('.player iframe').remove();
window.addEventListener('resize',fitScreen);
viewport?.addEventListener('resize',fitScreen);
document.addEventListener('visibilitychange',syncActive);
window.addEventListener('pageshow',syncActive);
fitScreen();

const soundToggle=document.querySelector('#soundToggle');
let soundOn=false,audioBus,lastCue=0;
try{soundOn=localStorage.getItem('game-room.sfx')==='on'}catch{}
const tones={
 tap:[[290,.04,0,'sine']],step:[[190,.055,0,'triangle'],[285,.06,.052,'triangle']],
 dice:[[310,.026,0,'square'],[205,.024,.048,'triangle'],[375,.05,.103,'triangle']],
 turn:[[392,.07,0,'triangle'],[494,.09,.07,'sine']],reveal:[[330,.10,0,'sine'],[440,.12,.075,'triangle'],[554,.15,.16,'sine']],
 reward:[[587,.08,0,'sine'],[784,.12,.065,'triangle']],win:[[392,.10,0,'triangle'],[494,.12,.10,'sine'],[659,.23,.21,'triangle']],
 impact:[[105,.08,0,'triangle'],[57,.11,.012,'sine']]
};
function showSound(){
 soundToggle.setAttribute('aria-pressed',String(soundOn));soundToggle.setAttribute('aria-label',soundOn?'Turn game sounds off':'Turn game sounds on');
 soundToggle.textContent=soundOn?'Sound on':'Sound off';
}
function unlockSound(){
 if(!soundOn)return;
 try{const Context=window.AudioContext||window.webkitAudioContext;if(!Context)return;audioBus??=new Context();if(audioBus.state!=='running')audioBus.resume().catch(()=>{})}catch{}
}
function playCue(kind){
 if(!soundOn||audioBus?.state!=='running'||!Object.hasOwn(tones,kind)||document.hidden)return;
 const t=audioBus.currentTime;if(t-lastCue<.055)return;lastCue=t;
 for(const [f,d,offset,type] of tones[kind]){
  const osc=audioBus.createOscillator(),gain=audioBus.createGain(),start=t+offset;
  osc.type=type;osc.frequency.setValueAtTime(f,start);if(kind==='impact')osc.frequency.exponentialRampToValueAtTime(f*.48,start+d);
  gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(type==='square'?.023:.07,start+.006);
  gain.gain.exponentialRampToValueAtTime(.0001,start+d);osc.connect(gain);gain.connect(audioBus.destination);osc.onended=()=>{osc.disconnect();gain.disconnect()};
  osc.start(start);osc.stop(start+d+.01);
 }
}
soundToggle.onclick=()=>{soundOn=!soundOn;try{localStorage.setItem('game-room.sfx',soundOn?'on':'off')}catch{}showSound();unlockSound();if(soundOn)audioBus?.resume().then(()=>playCue('reward')).catch(()=>{})};
menu.addEventListener('click',unlockSound);
window.addEventListener('message',event=>{
 if(event.data?.type==='room-cue'&&activeKey!=null&&event.source===frames.get(activeKey)?.contentWindow&&!resetDialog.open)playCue(event.data.cue);
});
showSound();</script></body></html>
