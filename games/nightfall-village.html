html,body{margin:0;width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
main{width:100%;min-width:0}
input,textarea,select{font-size:16px}
button{touch-action:manipulation}
main{padding:15px clamp(12px,4vw,17px) 24px}.seat{min-width:0;padding-inline:8px;overflow-wrap:anywhere}@media(max-width:360px){h1{font-size:34px}.cover{padding:20px 15px}.grid{gap:6px}}
.hunterPanel{border:1px solid #aa78606b;background:linear-gradient(135deg,#332935,#23263b)}
.hunterPanel h2{margin-top:0;color:#ffd6a4}
.hunterActions button{min-height:44px}
.wolfActions{display:flex;gap:5px;align-items:center}
.wolfActions button,.wolfPractice button{min-height:44px;white-space:nowrap;padding-inline:8px;font-size:13px}
.wolfPractice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.wolfNotebook{width:min(420px,calc(100vw - 26px));max-height:calc(100dvh - 24px);overflow:auto;overscroll-behavior:contain;padding:13px 14px 18px;border:1px solid #62516e;border-radius:18px;color:#fff0e6;background:#222337}
.wolfNotebook::backdrop{background:#111321a8}
.wolfNotebook h2,.wolfNotebook h3{margin:3px 0 8px}
.wolfNotebook h3{margin-top:15px}
.wolfNoteHeader,.wolfNoteSeat,.wolfReview .line{display:flex;align-items:center;justify-content:space-between;gap:6px}
.wolfNoteHeader{margin-bottom:9px}
.wolfNoteHeader button{min-height:44px}
.wolfNoteHeader small,.wolfNoteSeat small{color:#e4bda6;font-size:11px}
.wolfNoteSeat{border-top:1px solid #4f465f;padding:5px 0}
.wolfNoteSeat span{display:grid}
.wolfNoteSeat select{min-height:44px;padding:5px 10px;border:1px solid #796e87;border-radius:8px;background:#302f46;color:#fff1e7;font:inherit}
.wolfNotebook .panel{margin:7px 0}
@media(max-width:360px){.wolfActions button{font-size:12px;padding-inline:6px}}

body{background:#101626;color:#f8f4f0}
main{max-width:480px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-inline:clamp(12px,4vw,20px)}
.cover h1{font-size:clamp(31px,8vw,45px);line-height:1.03;letter-spacing:-.045em}
.cover,.panel,.skillCard,.nightCommit{border-radius:16px}
button:focus-visible{outline:3px solid #aaf3e2;outline-offset:2px}
.stages span{font-size:clamp(9px,2.6vw,12px)}
.usCase{border:1px solid #628d94;border-radius:12px;background:#203740;color:#d8ffed;padding:10px;margin:10px 0;font-size:13px}
.usCase strong{display:block;color:inherit}
.wolfPractice button{overflow-wrap:normal;line-height:1.2}
[data-action="makeCase"]{display:block;width:100%;margin-top:7px;color:#e5fff7;background:#294943;border-color:#779d91}

html[data-us-party=draw] .handOff{background:linear-gradient(145deg,#302267,#1e1b36);border:1px solid #61518d;border-radius:22px;color:#fff8f2;box-shadow:0 12px 28px #2414471c}
html[data-us-party=draw] .handOff p{color:#ded8ef}.handOff .tag{background:#d5f185;color:#202918}
.wordPair{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0 0}
.wordPair button{min-width:0;min-height:87px;border:1px solid #d6c6f5;border-radius:15px;background:#e6dafd;color:#2b174c;font-weight:800;font-size:19px;letter-spacing:-.03em;overflow-wrap:break-word}
.wordPair button+button{background:#fce2a4;border-color:#ebcb82;color:#483317}
.sketchGallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-bottom:14px}
.sketchGallery figure{margin:0;background:#fff;border:1px solid #d5cde4;border-radius:12px;overflow:hidden}
.sketchGallery img{display:block;width:100%;aspect-ratio:1;background:#fff}
.sketchGallery figcaption{padding:6px 7px;background:#f0ebf9}.sketchGallery b,.sketchGallery small{display:block}.sketchGallery small{color:#544765}
html[data-us-party=draw] .seat.hot .avatar{outline:2px solid #48318d;outline-offset:2px}

html[data-us-party=draw] .roomFace.avatar{font-size:0;color:transparent;background-repeat:no-repeat;border:1px solid #38314324}
.handoffFace{width:74px;height:74px;margin-bottom:15px;border-radius:20px;box-shadow:0 2px 0 #09061755,0 0 0 2px #faf2fc}
.grid .portrait.roomFace{position:relative;width:38px;height:38px;margin:0 0 5px;border-radius:10px;box-shadow:0 0 0 1px #ffffff24}
.grid .portrait.roomFace i{position:absolute;bottom:-1px;right:-4px;display:grid;place-items:center;width:15px;height:15px;border-radius:50%;background:#141a28;color:#fff3d4;border:1px solid #86869c;font:700 9px/1 system-ui}
.grid .seat:has(.roomFace){min-height:84px;line-height:1.15}.grid .seat:has(.roomFace) small{line-height:1.2;margin-top:2px}
dialog.routePopup>small{color:#4e5b57}
/* Evidence stays next to the current ballot */
.evidence{display:grid;grid-template-columns:1fr auto;align-items:center;gap:3px 8px;margin-top:9px;padding:11px 12px;border:1px solid #5b697a;border-inline-start:4px solid #acdacd;border-radius:12px;background:#192b35;color:#edf5ef}
.evidence small,.evidence p{grid-column:1}.evidence small{font-size:10px;color:#abd6ca;letter-spacing:.06em;text-transform:uppercase}.evidence strong{grid-column:1;font-size:16px}
.evidence p{margin:0;font-size:12px}.evidence button{min-height:44px;grid-column:2;grid-row:1/4;padding:4px 9px;background:#2b3b45;border:1px solid #729287;color:#edfff5}
.evidence button[aria-pressed=true]{background:#d4e9c7;color:#192b21}
.grid .seat[aria-pressed=true]{outline:2px solid #e6c090;outline-offset:-2px}

/* Two-person party rounds */
html[data-us-party=quiz] .turnChip,html[data-us-party=truth] .turnChip{display:inline-flex;align-items:center;border-radius:20px;background:#262134;color:#fff6ee;padding:5px 10px;font-weight:700}
html[data-us-party=quiz] .choice,html[data-us-party=truth] .choice{min-height:53px;line-height:1.25;text-align:left;padding:10px 14px;border-radius:13px}
html[data-us-party=quiz] .choice{border-left:4px solid #7f6be5}html[data-us-party=truth] .choice{border-left:4px solid #c96550}
.readBoost,.party-prompt [data-a=newTopic]{min-height:44px;padding:5px 12px;border:1px solid #9886c6;border-radius:12px;background:#fffcff;color:#443674;font-weight:700}
.readBoost{margin:0 8px 8px}.readBoost[aria-pressed=true]{color:white;background:#483881}.party-prompt [data-a=newTopic]{display:block;margin:8px 0 0;border-color:#c4816d;color:#7c362a;background:#fff7f2}
html[data-us-party=truth] #facts label{font-size:13px;font-weight:700}html[data-us-party=truth] #facts input{min-height:46px;font-size:16px}
.party-insights small{font-weight:750;color:#413585}

/* Field, mine, table and fighter controls */
.hud [data-action=hint]{color:#e5ffc2;border-color:#92bb77}
.hookButton.dropReady{border:2px dashed #ffce83;background:#3b2c20;color:#ffe1a5}.hookButton.dropReady small{color:#ffe0ac}
.fineAim{display:flex;align-items:center;gap:5px;color:#cdf4e4}.fineAim button{width:44px;height:44px;border:1px solid #486662;border-radius:10px;background:#203a3b;color:#d9ffee;font:700 20px/1 system-ui;touch-action:manipulation}
.fineAim button:disabled{opacity:.4}.fineAim span{font-size:10px;text-align:center}.fineAim output{display:block;font-weight:700;font-size:11px;min-width:36px;font-variant-numeric:tabular-nums}
@media(max-width:355px){.fineAim{gap:2px}.tableFooter{gap:3px}.ballTray{gap:1px}}
.hpCount{color:#cadbe3;font-size:10px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.sideControls button.special.chainReady{outline:3px solid #cbffbe;outline-offset:-2px;background:#cbffbe;color:#16261c}

button:focus-visible,[role=button]:focus-visible{outline:3px solid #8380ed;outline-offset:2px}button:active:not(:disabled){filter:brightness(.91)}</style><style>@keyframes dealIn{from{opacity:.25;transform:translateY(9px) rotate(-1deg)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.roundTrack{display:flex;gap:4px;margin:8px 0 13px}.roundTrack i{flex:1;height:4px;border-radius:9px;background:#b8abc14d}.roundTrack i.filled{background:var(--track,#7550cc)}

.roleTable{display:grid;place-items:center;padding:12px;background:radial-gradient(ellipse at 50% 30%,#3d3448,#191d2e 72%);border-radius:20px}
.rolePrint{display:block;background-size:300% 200%;background-repeat:no-repeat;aspect-ratio:1;flex:none}
.rolePrint[data-role=wolf]{background-position:0 0}.rolePrint[data-role=seer]{background-position:50% 0}.rolePrint[data-role=guard]{background-position:100% 0}.rolePrint[data-role=hunter]{background-position:0 100%}.rolePrint[data-role=town]{background-position:50% 100%}.rolePrint[data-role=back]{background-position:100% 100%}
.tarot{position:relative;display:block;width:min(100%,257px);overflow:hidden;padding:5px;border-radius:14px;border:1px solid #bfa470;background:#211f2c;color:#f9ecce;box-shadow:0 9px 22px #0a0914ad;text-align:left}
.tarot .rolePrint{border-radius:9px 9px 2px 2px}.tarot strong,.tarot div{display:block;padding:11px 12px}.tarot small{font:700 10px/1.3 system-ui;text-transform:uppercase;letter-spacing:.12em;color:#dfc492}
.tarot h2{color:#fff1cd;margin:5px 0;font-family:Georgia,serif;font-size:31px}.tarot p{margin:0;color:#ddd1bc;font-size:13px;line-height:1.45}
.cardBack strong{text-align:center}.faceUp{animation:dealIn .38s ease-out}.skillCard .skillIcon.rolePrint{border:1px solid #ae956f;width:64px;height:64px;border-radius:10px;min-width:64px}
main[data-phase=day] .panel,main[data-phase=vote] .panel{border-left:3px solid #ae9272}.stages [aria-current=step]{box-shadow:inset 0 -2px #edd095}

 if(!publicCase||publicCase.day!==day||runoff.length||!by(0).alive||!by(publicCase.id)?.alive)return null;
 const voter=alive().find(player=>player.id!==0&&player.id!==publicCase.id&&
  ['town','hunter'].includes(player.role)&&!Object.values(player.known).includes(true));
 return voter?.id??null;
}
function registerPublicCase(){
 if(phase!=='day'||publicCase||choice==null||choice===0||!by(0).alive||!by(choice).alive)return;
 publicCase={id:choice,day};
 log.unshift('Day '+day+' · You accused '+name(choice)+' in public.');
 choice=null;render();
}
function suspectEvidence(){
 if(choice==null||!['day','vote'].includes(phase)||!by(0).alive)return '';
 const latest=wolfBallots.at(-1),last=latest?.votes.find(v=>v.from===choice);
 const vote=latest?'Day '+latest.day+(latest.runoff?' runoff':' ballot')+' · '+(last?'Voted for '+name(last.to):'No vote recorded'):'No public ballot yet';
 const mark=wolfMarks[choice];
 return '<aside class="evidence"><small>Private notes</small><strong>'+name(choice)+'</strong><p>'+vote+'</p>'+
 '<button type="button" data-action="flagSuspect" aria-pressed="'+(mark==='suspect')+'">'+(mark==='suspect'?'Unmark suspect':'Mark as suspect')+'</button></aside>';
}
function publicCaseControls(){
 if(publicCase)return '<div class="usCase"><strong>Public accusation</strong>You accused '+name(publicCase.id)+' on Day '+publicCase.day+'.</div>';
 return '<div class="usCase"><strong>Public accusation · once per match</strong>Name one suspect to sway an undecided villager on today’s first ballot.'
  +btn('makeCase',choice==null?'Select a suspect':'Accuse '+name(choice),'',choice==null)+'</div>';
}
let wolfMarks=[],wolfBallots=[];
function resetWolfNotebook(){
 wolfMarks=Array(names.length).fill('');
 wolfBallots=[];
}
function archiveWolfVote(){
 wolfBallots.push({day,runoff:Boolean(runoff.length),votes:votes.slice()});
}
function openWolfNotebook(){
 const dialog=document.createElement('dialog');
 dialog.className='wolfNotebook';
 dialog.setAttribute('aria-labelledby','wolfNotebookTitle');
 const marks=people.slice(1).map(player=>{
  const label=wolfMarks[player.id];
  return `<label class="wolfNoteSeat"><span><b>${player.id+1} · ${name(player.id)}</b><small>${player.alive?'Active':'Out'}</small></span>
   <select data-mark="${player.id}" aria-label="${name(player.id)} private mark">
   ${[['','Unmarked'],['trust','Trust'],['suspect','Suspect']].map(([key,text])=>`<option value="${key}" ${label===key?'selected':''}>${text}</option>`).join('')}</select></label>`;
 }).join('');
 const reports=wolfBallots.slice().reverse().map(entry=>{
  const title='Day '+entry.day+' · '+(entry.runoff?'Runoff':'First ballot');
  return tally(entry.votes,title)||'<p>'+title+' · No votes</p>';
 }).join('');
 const known=checks.length?'<p>'+checks.map(check=>name(check.id)+' · '+(check.bad?'Werewolf':'Village')).join('　')+'</p>':'';
 dialog.innerHTML=`<div class="wolfNoteHeader"><div><small>Only you can see this</small><h2 id="wolfNotebookTitle">Field notes</h2></div><form method="dialog"><button>Close</button></form></div>
 <section aria-label="Player notes">${marks}</section>
 ${known?'<h3>My checks</h3>'+known:''}<h3>Ballot history</h3>
 ${reports||'<p>Completed ballots appear here.</p>'}`;
 dialog.addEventListener('change',event=>{
  const select=event.target.closest('select[data-mark]');
  if(select)wolfMarks[Number(select.dataset.mark)]=select.value;
 });
 dialog.addEventListener('close',()=>dialog.remove(),{once:true});
 document.body.append(dialog);dialog.showModal();
}
function wolfNotebookSummary(){
 const marked=people.filter(player=>wolfMarks[player.id]);
 if(!marked.length)return '';
 return `<section class="panel wolfReview"><strong>Your reads</strong>${marked.map(player=>`<div class="line"><b>${name(player.id)}</b><span>${wolfMarks[player.id]==='trust'?'Trust':'Suspect'} · ${titles[player.role]}</span></div>`).join('')}</section>`;
}
function home(){phase='home';main.dataset.phase=phase;main.innerHTML='<div class="cover"><div class="moon" aria-hidden="true"></div><div class="head">Social deduction · You vs. five bots</div><h1>Nightfall Village</h1><p>Act at night. By daylight, compare stories and ballots to decide whom to trust.</p></div><div class="stack">'+btn('random','Play with a random role','primary')+btn('hunterMode','Play as the Hunter')+ '<div class="wolfPractice">'+btn('seer','Practice Seer')+btn('guardPractice','Practice Guard')+btn('wolfPractice','Practice Werewolf')+btn('rules','How to play')+'</div>'+'</div>'}
function start(role){resetWolfNotebook();publicCase=null;hunterRound=role==='hunter';huntResume=null;questioned=null;const pool=['wolf','wolf','seer','guard',hunterRound?'hunter':'town','town'];if(role){pool.splice(pool.indexOf(role),1);people=[role,...shuffle(pool)]}else people=shuffle(pool);people=people.map((role,id)=>({role,id,alive:true,known:{},suspicion:null}));phase='identity';day=1;choice=null;guarded=null;checks=[];log=[];talk=[];votes=[];winner=null;revealed=false;posted=false;runoff=[];firstBallot=[];nightNotes=[];render()}
function checkWin(){const w=wolves().length;if(w===0)winner='Villagers';else if(w>=alive().length-w)winner='Werewolves';if(winner)phase='done';return !!winner}
function eligible(p){if(phase==='hunt')return canCounterattack(p);if(!by(0).alive||!p.alive)return false;if(phase==='day')return p.id!==0&&(questioned==null||!publicCase);if(phase==='vote')return p.id!==0&&(!runoff.length||runoff.includes(p.id));if(phase!=='night')return false;const role=by(0).role;if(role==='wolf')return p.role!=='wolf';if(role==='seer')return p.id!==0&&!checks.some(c=>c.id===p.id);return role==='guard'&&p.id!==guarded}
function night(){runoff=[];firstBallot=[];phase='night';choice=null;render()}
function resolveNight(){
 const w=wolves(),me=by(0),good=alive().filter(p=>p.role!=='wolf');
 const target=me.alive&&me.role==='wolf'&&choice!=null?choice:sample(good).id;
 const guard=alive().find(p=>p.role==='guard');
 const saved=guard?(guard.id===0?choice:sample(alive().filter(p=>p.id!==guarded))?.id):null;
 guarded=saved;
 const seer=alive().find(p=>p.role==='seer');
 if(seer){const id=seer.id===0?choice:sample(alive().filter(p=>p.id!==seer.id&&!(p.id in seer.known)))?.id;if(id!=null){const bad=by(id).role==='wolf';seer.known[id]=bad;if(seer.id===0)checks.push({id,bad})}}
 if(me.alive&&choice!=null){
  const action={wolf:'Targeted',seer:'Checked',guard:'Protected'}[me.role];
  if(action)nightNotes.unshift({day,text:action+' '+name(choice)+(me.role==='seer'?' · '+(by(choice).role==='wolf'?'Werewolf':'Village'):'')});
 }
 if(target!==saved)by(target).alive=false;
 log.unshift('Night '+day+' · '+(target===saved?'No one was eliminated':name(target)+' is out'));
 choice=null;afterElimination(target!==saved?target:null,continueDawn);
}
function continueDawn(){
 if(checkWin()){render();return}
 talk=alive().filter(p=>p.id!==0).map(p=>{
 const candidates=alive().filter(q=>q.id!==p.id&&(p.role!=='wolf'||q.role!=='wolf'));
 const previous=votes.find(v=>v.to===p.id)?.from;
 const suspect=candidates.find(q=>p.known[q.id]===true)||candidates.find(q=>q.id===previous&&p.known[q.id]!==false)||sample(candidates.filter(q=>p.known[q.id]!==false))||sample(candidates);
 p.suspicion=suspect?.id;
 return name(p.id)+': '+(suspect?(p.known[suspect.id]===true?'I checked '+name(suspect.id)+'. They are a werewolf.':previous===suspect.id?name(suspect.id)+' voted for me last round. I want to hear why.':'My main suspect is '+name(suspect.id)+'。'):'I need more evidence.')
 });posted=false;questioned=null;phase='day';render()
}
function resolveVote(){studioCue('turn');
 const audience=caseAudience();
 votes=alive().flatMap(p=>{
  if(p.id===0)return choice==null?[]:[{from:0,to:choice}];
  const candidates=alive().filter(q=>q.id!==p.id&&(!runoff.length||runoff.includes(q.id)));
  const rival=candidates.filter(q=>p.role!=='wolf'||q.role!=='wolf');
  const claim=posted&&by(0).alive&&p.role!=='wolf'?rival.find(q=>by(0).known[q.id]===true):null;
  const target=rival.find(q=>p.known[q.id]===true)||claim||(audience===p.id?rival.find(q=>q.id===publicCase.id):null)||rival.find(q=>q.id===p.suspicion)||sample(rival);
  return target?[{from:p.id,to:target.id}]:[];
 });
 archiveWolfVote();
 const counts=alive().map(p=>({id:p.id,n:votes.filter(v=>v.to===p.id).length}));
 const highest=Math.max(...counts.map(c=>c.n));
 const leaders=highest?counts.filter(c=>c.n===highest).map(c=>c.id):[];
 if(leaders.length>1&&!runoff.length){
  runoff=leaders;firstBallot=votes.slice();choice=null;phase='defense';render();return;
 }
 const out=leaders.length===1?leaders[0]:null;
 if(out!=null)by(out).alive=false;
 log.unshift('Day '+day+' · '+(runoff.length?'Runoff · ':'')+(out==null?'No one was eliminated':name(out)+' was voted out'));
 afterElimination(out,()=>{if(!checkWin())phase='ballot';render()})
}
function tally(ballots,label){
 if(!ballots.length)return '';
 const targets=[...new Set(ballots.map(v=>v.to))];
 const voters=id=>ballots.filter(v=>v.to===id);
 return `<div class="panel"><strong>${label}</strong>${targets.sort((a,b)=>voters(b).length-voters(a).length).map(id=>`
 <div class="line voteLine"><b>${name(id)}</b><span>${voters(id).map(v=>name(v.from)).join(', ')}</span><i>${voters(id).length} votes</i></div>`).join('')}</div>`;
}
const nightSkills={
 hunter:{title:'Wait for dawn',symbol:'☾',verb:'',effect:'You can make one final move if eliminated.'},
 guard:{title:'Night watch',symbol:'◇',verb:'Protected',effect:'If the wolves pick this player tonight, they are protected.'},
 seer:{title:'Read allegiance',symbol:'◉',verb:'Checked',effect:'See this player’s allegiance in your notes at dawn.'},
 wolf:{title:'Choose a target',symbol:'✦',verb:'Target',effect:'The target is out at dawn unless the Guard protects them.'},
 town:{title:'Wait for daylight',symbol:'☾',verb:'',effect:'Look for clues in statements and votes at dawn.'}
};
function renderNight(grid){
 const me=by(0),skill=nightSkills[me.role],canAct=people.some(eligible);
 const count=alive().length;
 const target=choice==null?null:by(choice);
 const title=me.alive?skill.title:'Spectating';
 const privateLog=nightNotes.length?nightNotes.map(n=>`<div class="nightLine"><time>Night ${n.day}</time><span>${n.text}</span></div>`).join(''):'<p>Your night actions appear here after you confirm them.</p>';
 const publicUpdate=log.length?`<div class="nightLine"><span>${log[0]}</span></div>`:'<p>The first night report appears at dawn.</p>';
 const label=target?'Confirm '+skill.verb+' '+name(target.id):canAct?'Select a player':'Continue to dawn';
 const detail=target?skill.effect:canAct?'Tap a player, then confirm or change your choice.':'You have no night action right now.';
 return `<section class="nightHero"><span class="nightMoon" aria-hidden="true"></span><div class="nightScene"><h2>Night ${day}</h2><span>Active ${count} / ${people.length}</span></div></section>
 <section class="skillCard"><span aria-hidden="true" class="skillIcon rolePrint" data-role="${me.alive?me.role:'back'}">${me.alive?'':'☾'}</span><div><small>${me.alive?titles[me.role]+' · Private ability':'Spectating'}</small><h3>${title}</h3><p>${me.alive?hints[me.role]:'You are out. You can watch until the match ends.'}</p></div></section>
 <section class="nightTargets"><h3>${canAct?'Choose a target':'Seats'}</h3>${grid}</section>
 <section class="nightCommit">${target?`<b><span class="targetNumber">${target.id+1}</span> ${skill.verb} ${name(target.id)}</b>`:''}<p>${detail}</p>${btn('resolveNight',label,'primary',canAct&&!target)}</section>
 <section class="nightJournal"><h3>Private night log <small>Only you can see this</small></h3>${privateLog}<h3>Latest report</h3>${publicUpdate}</section>`;
}
function render(){
 const visible=phase==='done';
 const stages=[['identity','Role'],['night','Night'],['day','Talk'],['vote','Vote'],['ballot','Tally']];
 const progress=phase==='done'||phase==='hunt'?'':`<div class="stages" aria-label="Current phase">${stages.map(([key,text])=>`<span ${(phase===key||key==='vote'&&phase==='defense')?'aria-current="step"':''}>${text}</span>`).join('')}</div>`;
 const grid='<div class="grid">'+people.map(p=>'<button class="seat" data-action="seat'+p.id+'" aria-pressed="'+(choice===p.id)+'" '+(eligible(p)?'':'disabled')+'><span class="portrait roomFace" data-face="'+p.id+'"><i>'+(p.id+1)+'</i></span>'+name(p.id)+'<small>'+(wolfMarks[p.id]==='suspect'&&['day','vote'].includes(phase)?'Marked suspect':visible&&phase==='done'?titles[p.role]:!p.alive?'Out':phase==='night'&&by(0).role==='guard'&&guarded===p.id?'Protected last night':phase==='night'&&by(0).role==='seer'&&checks.some(c=>c.id===p.id)?'Checked':p.id===0?'You':by(0).role==='wolf'&&p.role==='wolf'?'Wolf ally':'Active')+'</small></button>').join('')+'</div>'+suspectEvidence();
 const notes=checks.length?'<div class="panel"><strong>My checks</strong>'+checks.map(c=>'<p>'+name(c.id)+' · '+(c.bad?'Werewolf':'Village')+'</p>').join('')+'</div>':'';
 const history=log.length?'<div class="panel"><strong>Match log</strong>'+log.map(line=>'<div class="line">'+line+'</div>').join('')+'</div>':'';
 const ballot=tally(votes,runoff.length&&phase!=='defense'?'Runoff votes':'First ballot');
 const opening=firstBallot.length&&phase!=='defense'?tally(firstBallot,'First ballot'):'';
 const witness=questioned==null?null:by(questioned);
 const reply=!witness?'':witness.suspicion==null?'I need more evidence.':witness.known[witness.suspicion]===true?'I checked '+name(witness.suspicion)+'. They are a werewolf.':votes.some(v=>v.from===witness.suspicion&&v.to===witness.id)?name(witness.suspicion)+' voted for me. I want to hear why.':'I might vote for '+name(witness.suspicion)+'. Check the ballots and decide for yourself.';
 let body='';
 if(phase==='identity'){
  const role=revealed?by(0).role:'back';
  const picture='<span class="rolePrint" data-role="'+role+'" aria-hidden="true"></span>';
  body='<div class="roleTable">'+(revealed?'<article class="tarot faceUp">'+picture+'<div><small>Private role · '+(role==='wolf'?'Wolf pack':'Village')+'</small><h2>'+titles[role]+'</h2><p>'+hints[role]+'</p></div></article>':'<button type="button" class="tarot cardBack" data-action="reveal">'+picture+'<strong>Reveal your role</strong></button>')+'</div>'+(revealed?'<div class="stack">'+btn('night','Begin Night 1','primary')+'</div>':'');
 }
 if(phase==='night')body=renderNight(grid);
 if(phase==='hunt')body=renderHunt(grid)+notes+ballot+history;
 if(phase==='day')body='<h2>Day '+day+' · Talk</h2><div class="panel"><strong>'+log[0]+'</strong>'+talk.map(line=>'<div class="line">'+line+'</div>').join('')+(posted?'<p class="hint">You shared your checks.</p>':'')+'</div>'+(by(0).alive?'<div class="panel"><strong>Question a player</strong><p>You can question one person each day before voting.</p>'+(witness?'<div class="line">'+name(witness.id)+': '+reply+'</div>':'')+(people.some(eligible)?grid:'')+(witness?'':btn('question','Ask about their vote','',choice==null))+publicCaseControls()+'</div>':'')+'<div class="stack">'+(by(0).alive&&checks.length&&!posted?btn('claim','Share my checks'):'')+btn('vote',by(0).alive?'Start voting':'Watch the vote','primary')+'</div>'+notes+ballot;
 if(phase==='vote')body='<h2>Cast your vote</h2><p>'+(runoff.length?'Vote among the tied players. If it ties again, nobody leaves.':'The player with the most votes is out. A tie triggers a runoff.')+'</p>'+grid+'<div class="split">'+btn('resolveVote',by(0).alive?'Confirm vote':'View results','primary',by(0).alive&&choice==null)+(by(0).alive?btn('abstain','Abstain'):'')+'</div>'+notes;
 if(phase==='defense'){
 const lines=runoff.map(id=>{
  const accused=by(id), suspects=alive().filter(p=>p.id!==id&&runoff.includes(p.id));
  const alternative=suspects.find(p=>p.id===accused.suspicion)||suspects[0];
  const text=id===0?'You are on the runoff ballot. Review the votes before deciding.':accused.known[alternative?.id]===true?'I checked '+name(alternative.id)+'. They are a werewolf.':alternative?'My main suspect is '+name(alternative.id)+'. Look at who voted for me last round.':'Take another look at the votes.';
  return `<article class="panel defense"><strong>${name(id)}</strong><p>${text}</p></article>`;
 }).join('');
 body='<h2>Runoff statements</h2><p>Only players tied for the most votes are in the runoff.</p>'+ballot+lines+'<div class="stack">'+btn('vote','Start runoff','primary')+'</div>';
 }
 if(phase==='ballot')body='<h2>'+log[0]+'</h2><div class="stack">'+btn('advance','Next night','primary')+'</div>'+ballot+opening+history;
 if(phase==='done')body='<h1>'+winner+' prevail</h1><p>Your role: '+titles[by(0).role]+' · '+((by(0).role==='wolf')===(winner==='Werewolves')?'You won':'You lost')+'</p>'+grid+'<div class="stack">'+btn(hunterRound?'hunterMode':'random','Play again','primary')+btn('home','Back to setup')+'</div>'+wolfNotebookSummary()+ballot+opening+history;
 main.dataset.phase=phase;main.innerHTML='<div class="head"><span>Nightfall Village'+(hunterRound?' · Hunter mode':'')+(revealed?' · '+titles[by(0).role]:'')+'</span><div class="wolfActions">'+(phase==='identity'?'':btn('notebook','Notes'))+btn('rules','Rules')+'</div></div>'+progress+body;
}
main.addEventListener('click',e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;if(a==='rules'){const d=document.createElement('dialog');d.style.cssText='max-width:340px;border:0;border-radius:20px;background:#292043;color:white';d.innerHTML='<h2>Six-player rules</h2><p>Two Werewolves, a Seer, a Guard and two Villagers. Use abilities at night, then discuss and vote. A first tie triggers a runoff. Villagers win when both wolves are gone. Wolves win once they equal or outnumber the village. The Hunter mode replaces one Villager and grants a final move if you are eliminated. Each match gives you one public accusation that can sway a villager.</p><form method="dialog"><button>Back</button></form>';document.body.append(d);d.onclose=()=>d.remove();d.showModal();return}
 if(a==='notebook')openWolfNotebook();else if(a==='guardPractice'||a==='wolfPractice')start(a==='guardPractice'?'guard':'wolf');else if(a==='home')home();else if(a==='random'||a==='seer')start(a==='seer'?'seer':null);else if(a==='hunterMode')start('hunter');else if(a==='huntFire'||a==='huntSkip')resolveHunt(a==='huntSkip');else if(a==='reveal'){revealed=true;studioCue('reveal');render()}else if(a==='night')night();else if(a==='advance'){day++;night()}else if(a==='resolveNight')resolveNight();else if(a==='vote'){phase='vote';choice=null;render()}else if(a==='question'&&phase==='day'&&questioned==null&&choice!=null){questioned=choice;choice=null;render()}else if(a==='flagSuspect'&&choice!=null&&choice!==0&&by(0).alive&&['day','vote'].includes(phase)){wolfMarks[choice]=wolfMarks[choice]==='suspect'?'':'suspect';render()}else if(a==='makeCase')registerPublicCase();else if(a==='claim'){posted=true;render()}else if(a==='resolveVote'||a==='abstain'){if(a==='abstain')choice=null;resolveVote()}else if(a.startsWith('seat')){const id=Number(a.slice(4));if(eligible(by(id))){choice=id;render()}}});
home();
</script></body></html>
