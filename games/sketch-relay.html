.party-picker-label{font-size:13px;font-weight:750;margin:14px 0 8px}
.party-theme{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:7px 0 10px}
button.party-choice{min-height:44px;padding:6px 8px;border:1px solid #d8cce9;border-radius:10px;background:#f1e9fb;color:#412873;font-size:13px;font-weight:750;text-align:center}
button.party-choice[aria-pressed=true]{background:#6336b9;border-color:#6336b9;color:white}
.party-hintrow{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin-top:5px}
.party-hintrow button{min-height:44px;padding:5px 9px;background:#e9d9f9;border:1px solid #d6c1ee;color:#3f296a;border-radius:10px;font-size:12px}
.party-hintrow small{color:#594674;font-size:11px}
.party-hint{padding:6px 8px;margin:2px 0 0;background:#ede1ff;color:#472978;border-radius:8px;font-size:12px}
.party-prompt{display:grid;gap:3px;padding:10px 11px;background:#eee6f9;border:1px solid #dbceee;border-radius:11px;font-size:13px;color:#432a6b;overflow-wrap:anywhere}
.party-prompt span{font-size:12px}
.party-ask{display:grid;grid-template-columns:minmax(82px,1fr) auto;gap:5px 8px;align-items:center;margin-top:10px;padding:9px;border:1px solid #e1d4ec;background:#f4edf9;border-radius:11px}
.party-ask label{grid-column:1/-1;font-size:12px;color:#53396d}
.party-ask select,.party-ask .btn{min-height:44px;font-size:14px}
.party-skip{margin-top:7px}
[hidden]{display:none!important}
.match .drawToolbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin:7px 0 0}
.match .drawToolbar button,.match .drawToolbar .swatch{width:100%;min-width:0;font-size:12px}
.match .drawToolbar button.primary{background:#643cca;color:white}
@media(max-height:650px){.match:has(.drawToolbar) canvas{width:min(100%,max(128px,calc(100dvh - 324px)))}}
.party-side,.party-odds,.party-insights{margin:10px 0;color:#493666}
.party-side{border:1px solid #dcd1ed;border-radius:11px;background:#f5f0fc;overflow:hidden}
.party-side summary{padding:11px;min-height:44px;cursor:pointer;font-size:14px;font-weight:750}
.party-side summary small{margin-left:5px;color:#685781;font-weight:500}
.party-predictions,.party-odds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.party-predictions{padding:0 8px 8px}
.party-odds>small{grid-column:1/-1}
.party-odds button small{color:inherit;font-size:11px;font-weight:550}
.party-insights .line{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:3px 7px}

html[data-us-party]{color-scheme:light;--party-ink:#17223b;--party-paper:#fafafd;--party-accent:#4743cf;--party-accent-soft:#edf0ff}
html[data-us-party="truth"]{--party-accent:#ae3d36;--party-accent-soft:#fff0e9}
html[data-us-party="draw"]{--party-accent:#453aca;--party-accent-soft:#eeebff}
html[data-us-party] body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--party-paper);color:var(--party-ink)}
html[data-us-party] :is(.primary,.match .drawToolbar button.primary,button.party-choice[aria-pressed=true]){background:var(--party-accent);border-color:var(--party-accent);color:#fff}
html[data-us-party] :is(.party-choice,.party-prompt,.party-ask,.party-side,.party-hint,.tag){background:var(--party-accent-soft);color:var(--party-ink);border-color:#dbe1f2}
html[data-us-party] :is(button,a,input,summary,select):focus-visible{outline:2px solid var(--party-accent);outline-offset:2px}
html[data-us-party] :is(.stack,.line,.pass){overflow-wrap:anywhere}
html[data-us-party] :is(.stack button,.party-choice,.mode-options button){min-height:44px}
html[data-us-party] :is(.row input,.party-ask select){width:100%;min-width:0}
html[data-us-party] .turnProgress{font-variant-numeric:tabular-nums}
html[data-us-party] .mode-options{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:7px 0 12px}
html[data-us-party=draw] .seat small{white-space:nowrap;font-size:clamp(8px,2vw,10px)}
html[data-us-party=draw] .drawToolbar button{padding-inline:2px;font-size:clamp(9px,2.7vw,12px)}

/* Property route tickets */
.routeCards .routeCard{align-content:start;border-radius:14px;padding:11px;gap:6px;background:#f6fbf5;border:1px solid #8fb3a4;color:#163b33}
.routeCards .route1{background:#f7f1ff;border-color:#b29bc8;color:#3f2854}
.routeBudget{display:grid;gap:2px;margin-top:3px;padding-top:7px;border-top:1px dashed currentColor}
.routeBudget small{font-size:10px;font-weight:600}.routeBudget b{font-size:18px;line-height:1.1;font-variant-numeric:tabular-nums}

/* Private word deal and post-match sketch prints */
html[data-us-party=draw] .handOff{background:linear-gradient(145deg,#302267,#1e1b36);border:1px solid #61518d;border-radius:22px;color:#fff8f2;box-shadow:0 12px 28px #2414471c}
html[data-us-party=draw] .handOff p{color:#ded8ef}.handOff .tag{background:#d5f185;color:#202918}
.wordPair{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0 0}
.wordPair button{min-width:0;min-height:87px;border:1px solid #d6c6f5;border-radius:15px;background:#e6dafd;color:#2b174c;font-weight:800;font-size:19px;letter-spacing:-.03em;overflow-wrap:break-word}
.wordPair button+button{background:#fce2a4;border-color:#ebcb82;color:#483317}
.sketchGallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-bottom:14px}
.sketchGallery figure{margin:0;background:#fff;border:1px solid #d5cde4;border-radius:12px;overflow:hidden}
.sketchGallery img{display:block;width:100%;aspect-ratio:1;background:#fff}
.sketchGallery figcaption{padding:6px 7px;background:#f0ebf9}.sketchGallery b,.sketchGallery small{display:block}.sketchGallery small{color:#544765}
html[data-us-party=draw] .seat.hot .avatar{outline:2px solid #48318d;outline-offset:2px}

html[data-us-party=draw] .roomFace.avatar{font-size:0;color:transparent;background-repeat:no-repeat;border:1px solid #38314324}
.handoffFace{width:74px;height:74px;margin-bottom:15px;border-radius:20px;box-shadow:0 2px 0 #09061755,0 0 0 2px #faf2fc}
.grid .portrait.roomFace{position:relative;width:38px;height:38px;margin:0 0 5px;border-radius:10px;box-shadow:0 0 0 1px #ffffff24}
.grid .portrait.roomFace i{position:absolute;bottom:-1px;right:-4px;display:grid;place-items:center;width:15px;height:15px;border-radius:50%;background:#141a28;color:#fff3d4;border:1px solid #86869c;font:700 9px/1 system-ui}
.grid .seat:has(.roomFace){min-height:84px;line-height:1.15}.grid .seat:has(.roomFace) small{line-height:1.2;margin-top:2px}
dialog.routePopup>small{color:#4e5b57}
/* Evidence stays next to the current ballot */
.evidence{display:grid;grid-template-columns:1fr auto;align-items:center;gap:3px 8px;margin-top:9px;padding:11px 12px;border:1px solid #5b697a;border-inline-start:4px solid #acdacd;border-radius:12px;background:#192b35;color:#edf5ef}
.evidence small,.evidence p{grid-column:1}.evidence small{font-size:10px;color:#abd6ca;letter-spacing:.06em;text-transform:uppercase}.evidence strong{grid-column:1;font-size:16px}
.evidence p{margin:0;font-size:12px}.evidence button{min-height:44px;grid-column:2;grid-row:1/4;padding:4px 9px;background:#2b3b45;border:1px solid #729287;color:#edfff5}
.evidence button[aria-pressed=true]{background:#d4e9c7;color:#192b21}
.grid .seat[aria-pressed=true]{outline:2px solid #e6c090;outline-offset:-2px}

/* Two-person party rounds */
html[data-us-party=quiz] .turnChip,html[data-us-party=truth] .turnChip{display:inline-flex;align-items:center;border-radius:20px;background:#262134;color:#fff6ee;padding:5px 10px;font-weight:700}
html[data-us-party=quiz] .choice,html[data-us-party=truth] .choice{min-height:53px;line-height:1.25;text-align:left;padding:10px 14px;border-radius:13px}
html[data-us-party=quiz] .choice{border-left:4px solid #7f6be5}html[data-us-party=truth] .choice{border-left:4px solid #c96550}
.readBoost,.party-prompt [data-a=newTopic]{min-height:44px;padding:5px 12px;border:1px solid #9886c6;border-radius:12px;background:#fffcff;color:#443674;font-weight:700}
.readBoost{margin:0 8px 8px}.readBoost[aria-pressed=true]{color:white;background:#483881}.party-prompt [data-a=newTopic]{display:block;margin:8px 0 0;border-color:#c4816d;color:#7c362a;background:#fff7f2}
html[data-us-party=truth] #facts label{font-size:13px;font-weight:700}html[data-us-party=truth] #facts input{min-height:46px;font-size:16px}
.party-insights small{font-weight:750;color:#413585}

/* Field, mine, table and fighter controls */
.hud [data-action=hint]{color:#e5ffc2;border-color:#92bb77}
.hookButton.dropReady{border:2px dashed #ffce83;background:#3b2c20;color:#ffe1a5}.hookButton.dropReady small{color:#ffe0ac}
.fineAim{display:flex;align-items:center;gap:5px;color:#cdf4e4}.fineAim button{width:44px;height:44px;border:1px solid #486662;border-radius:10px;background:#203a3b;color:#d9ffee;font:700 20px/1 system-ui;touch-action:manipulation}
.fineAim button:disabled{opacity:.4}.fineAim span{font-size:10px;text-align:center}.fineAim output{display:block;font-weight:700;font-size:11px;min-width:36px;font-variant-numeric:tabular-nums}
@media(max-width:355px){.fineAim{gap:2px}.tableFooter{gap:3px}.ballTray{gap:1px}}
.hpCount{color:#cadbe3;font-size:10px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.sideControls button.special.chainReady{outline:3px solid #cbffbe;outline-offset:-2px;background:#cbffbe;color:#16261c}

button:focus-visible,[role=button]:focus-visible{outline:3px solid #8380ed;outline-offset:2px}button:active:not(:disabled){filter:brightness(.91)}</style><style>@keyframes dealIn{from{opacity:.25;transform:translateY(9px) rotate(-1deg)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.roundTrack{display:flex;gap:4px;margin:8px 0 13px}.roundTrack i{flex:1;height:4px;border-radius:9px;background:#b8abc14d}.roundTrack i.filled{background:var(--track,#7550cc)}

html[data-us-party=draw] .match{background:#f4effb}.match .matchhead{display:flex;align-items:center;justify-content:space-between}.match .matchhead .tag{background:#27203f;color:#f8f6e9;letter-spacing:.065em;text-transform:uppercase;font:700 10px/1.2 system-ui;padding:7px 10px}
.matchbody h2{font-size:clamp(23px,6vw,32px);letter-spacing:-.045em;margin:3px 0}.match .clock:not(:empty){padding:6px 9px;border-radius:8px;color:#392763;background:linear-gradient(90deg,#d4c1fa var(--time,100%),#e8deef 0);font:750 13px ui-monospace,monospace}.match .clock.urgent{color:#7d1e20;background:#ffdbcb}
.match canvas{background-color:#fffcf6;background-image:radial-gradient(#dcd4c8 1px,transparent 1px);background-size:13px 13px;border:1px solid #c8bccf;border-radius:16px;box-shadow:0 3px 0 #d9cee3}
.match .seats{border:0;padding:7px;border-radius:15px;background:#231f32;gap:3px}.match .seat{background:transparent;border-radius:10px;color:#efebfa}.match .seat small{color:#c0b8d1}.match .seat.hot{background:#e5ff99;color:#30233d;box-shadow:none}.match .seat.hot small{color:#3e3550}.match .seat.hit:not(.hot){background:#35483c}
.match .drawToolbar{background:#29243b;padding:6px;border-radius:13px}.match .drawToolbar button{border-radius:7px;border:1px solid #554b66;background:#3c354e;color:white}.match .drawToolbar button.primary{background:#e4fc9d;color:#282236}

let drawPack='mix',previousDrawWords=[],hintLeft=true,roundHint=false,artistPoints=0;
function drawThemePicker(){
 return '<div class="party-theme" role="group" aria-label="Choose a word pack">'+Object.entries(drawPackLabels).map(([key,label])=>
  '<button type="button" class="party-choice" data-a="pack-'+key+'" aria-pressed="'+(drawPack===key)+'">'+label+'</button>').join('')+'</div>';
}
function drawTitlePacks(){
 const selected=drawPack==='mix'?Object.values(drawPacks).flat():drawPacks[drawPack];
 const fresh=shuffled(selected.filter(item=>!previousDrawWords.includes(item)));
 const seen=shuffled(selected.filter(item=>previousDrawWords.includes(item)));
 previousDrawWords=fresh.concat(seen).slice(0,3);

 return previousDrawWords;
}
function drawHintControls(){
 if(roundHint)return '<p class="party-hint" role="status">'+word[1]+' · 50 pts if correct</p>';

}
function useDrawHint(){
 if(!drawIsActive()||phase!=='guess'||!manual(order[turn])||!hintLeft||Date.now()>=deadline)return;
 hintLeft=false;roundHint=true;
 const row=main.querySelector('.party-hintrow');
 row.querySelector('button').hidden=true;row.querySelector('small').hidden=true;

let drawCanvasWidth=5,drawErasing=false,drawRedo=[],drawSwapped=false;
let drawJobState=null,drawClockState=null,drawInHub=true;
const drawIsActive=()=>drawInHub&&!document.hidden;

function stopDrawTiming(){
 clearTimeout(job);clearInterval(tick);
 drawJobState=drawClockState=null;
}
function pauseDrawTiming(){
 clearTimeout(job);clearInterval(tick);
 for(const state of [drawJobState,drawClockState]){
  if(!state?.end)continue;
  state.remaining=Math.max(0,state.end-Date.now());
  state.end=0;
 }
}
function resumeDrawTiming(){
 if(!drawIsActive())return;
 if(drawJobState&&!drawJobState.end){
  const state=drawJobState;
  state.end=Date.now()+state.remaining;
  job=setTimeout(()=>{
   if(drawJobState!==state)return;
   if(!drawIsActive()){pauseDrawTiming();return}
   drawJobState=null;state.callback();
  },state.remaining);
 }
 if(drawClockState&&!drawClockState.end){
  const state=drawClockState;
  deadline=state.end=Date.now()+state.remaining;
  tick=setInterval(showDrawTime,100);
  showDrawTime();
 }
}
function scheduleDraw(callback,remaining){
 clearTimeout(job);
 drawJobState={callback,remaining,end:0};
 resumeDrawTiming();
}
function clock(seconds,callback){
 clearInterval(tick);
 drawClockState={callback,remaining:seconds*1000,end:0};
 resumeDrawTiming();
}
function showDrawTime(){
 const state=drawClockState;
 if(!state||!state.end)return;
 if(!drawIsActive()){pauseDrawTiming();return}
 const left=Math.max(0,Math.ceil((state.end-Date.now())/1000));
 const el=main.querySelector('.clock');
 if(el){el.style.setProperty('--time',100*Math.min(1,left/(phase==='draw'?45:12))+'%');el.textContent=left+'s';el.classList.toggle('urgent',left<=3)}
 if(left===0){clearInterval(tick);drawClockState=null;state.callback()}
}
function drawVisibilityChanged(){
 if(drawIsActive())resumeDrawTiming();
 else{active=null;pauseDrawTiming()}
}
window.addEventListener('message',event=>{
 if(window.parent===window||event.source!==window.parent||event.data?.type!=='arcade-visibility')return;
 drawInHub=Boolean(event.data.active);drawVisibilityChanged();
});
document.addEventListener('visibilitychange',drawVisibilityChanged);

function demoPainterOrder(){
 const seats=shuffled(players.slice(1).map(player=>player.id)).slice(0,2);
 seats.splice(Math.floor(Math.random()*3),0,0);
 return seats;
}
function resetDrawTools(){
 drawCanvasWidth=5;drawErasing=false;drawRedo=[];drawSwapped=false;
}
function drawToolPanel(){
 if(phase!=='draw'||!manual(painter))return '';
 const colors=inks.map((color,i)=>`<button class="swatch" data-a="ink${i}" aria-label="${['Black','Pink','Purple','Green'][i]}" aria-pressed="${!drawErasing&&pen===color}"><i style="--ink:${color}"></i></button>`).join('');
 return `<div class="tools drawToolbar">${colors}<button data-a="eraser" aria-pressed="${drawErasing}">Eraser</button><button data-a="width" aria-label="Change pen width">${drawCanvasWidth===5?'Fine':'Bold'}</button>${button('undo','Undo')}${button('redo','Redo')}${button('swapWord','Swap')}${button('doneDraw','Done','primary')}</div>`;
}
function syncDrawTools(){
 const undo=main.querySelector('[data-a=undo]');
 if(!undo)return;
 undo.disabled=!strokes.length;
 main.querySelector('[data-a=redo]').disabled=!drawRedo.length;
 main.querySelector('[data-a=swapWord]').disabled=drawSwapped||!!(strokes.length||drawRedo.length);
 main.querySelector('[data-a=width]').textContent=drawCanvasWidth===5?'Fine':'Bold';
 main.querySelector('[data-a=eraser]').setAttribute('aria-pressed',String(drawErasing));
 main.querySelectorAll('.swatch').forEach((el,index)=>el.setAttribute('aria-pressed',String(!drawErasing&&pen===inks[index])));
}
function changeDrawTool(action){
 if(!drawIsActive()||Date.now()>=deadline)return;
 if(action==='doneDraw'){startGuess();return}
 if(action==='undo'&&strokes.length)drawRedo.push(strokes.pop());
 if(action==='redo'&&drawRedo.length)strokes.push(drawRedo.pop());
 if(action==='eraser')drawErasing=!drawErasing;
 if(action==='width')drawCanvasWidth=drawCanvasWidth===5?10:5;
 if(action.startsWith('ink')){
  const next=inks[Number(action.slice(3))];
  if(next){pen=next;drawErasing=false}
 }
 if(action==='swapWord'&&!drawSwapped&&!strokes.length&&!drawRedo.length){
  const pool=drawPack==='mix'?Object.values(drawPacks).flat():drawPacks[drawPack];
  const replacement=shuffled(pool.filter(item=>!words.includes(item)))[0];
  if(replacement){word=words[round]=replacement;drawSwapped=true;render();bindCanvas();showDrawTime()}
 }
 syncDrawTools();paint();
}

const main=document.querySelector('main');
let localParty=true;
const manual=id=>localParty||id===0;
const players=['You','Sam','Riley','Avery','Jamie','Jordan','Alex','Morgan'].map((name,id)=>({name,id,score:0}));
const palette=['#dbd0ff','#ffd49f','#9eeddd','#f6adc7','#bed7ff','#e6ee8e','#cec4fb','#f8b8a1'];
const inks=['#272139','#ef597f','#7252d5','#249b80'];
let painters,words,round,painter,word,phase,order,turn,strokes,pen,active,job,tick,deadline,record,paintEpoch=0;
const shuffled=items=>{const a=items.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const name=id=>players[id].name;
const button=(a,label,css='')=>`<button type="button" class="${css}" data-a="${a}">${label}</button>`;
const ready=()=>{stopDrawTiming();active=null;paintEpoch++};
const demoNames=players.map(p=>p.name);
function home(){
 ready();phase='home';
 main.innerHTML=`<div class="hero"><span class="tag">8 seats · 3 rounds</span><h1>Sketch Relay</h1><p>Three artists, seven guesses per sketch. Score 100 for a correct guess. Artists earn 20 per correct guess, up to 100 per round.</p><div class="doodle" aria-hidden="true"><i></i><i></i><i></i><b>?</b></div></div><div class="stack"><div class="mode-options" aria-label="Players"><button data-a="localRoom" aria-pressed="${localParty}">Pass & play · 8</button><button data-a="soloRoom" aria-pressed="${!localParty}">Solo practice</button></div>${drawThemePicker()}${button('begin','Play','primary')}<p>${localParty?'Share one phone. Each player gets a private turn.':'Practice with seven simulated seats.'}</p></div>`;
}
function start(){
 sketchCards=[];wordOptions=[];
 players.forEach(p=>p.score=0);players.forEach((p,i)=>p.name=localParty?'P'+(i+1):demoNames[i]);painters=localParty?shuffled(players.map(p=>p.id)).slice(0,3):demoPainterOrder();
 words=drawTitlePacks();round=0;nextRound();
}
function nextRound(){
 ready();
 if(round===3){final();return}
 painter=painters[round];word=words[round];order=players.map((_,i)=>(painter+i+1)%8).slice(0,7);
 turn=0;roundHint=false;artistPoints=0;resetDrawTools();strokes=[];record=new Map();pen=inks[0];phase='draw';if(localParty){passDevice(painter,true);return}render();
 if(manual(painter)){bindCanvas();clock(45,startGuess);return}
 const frames=word[3].flatMap(points=>points.map((_,i)=>({points:points.slice(0,i+1),first:i===0})));
 const epoch=paintEpoch;
 function step(i){
  if(epoch!==paintEpoch)return;
  if(i>=frames.length){scheduleDraw(startGuess,600);return}
  const f=frames[i],line={ink:inks[0],points:f.points};
  if(f.first)strokes.push(line);else strokes[strokes.length-1]=line;
  paint();scheduleDraw(()=>step(i+1),100);
 }
 step(0);
}
function render(){
 const guesser=phase==='guess'?order[turn]:null;
 const lead=phase==='draw'?(manual(painter)?(localParty?name(painter)+' draws':'Your turn to draw'):'Drawing · '+name(painter)):phase==='guess'?((guesser!==null&&manual(guesser))?(localParty?name(guesser)+' guesses':'Your turn to guess'):name(guesser)+' is guessing'):'It was “'+word[0]+'”';
 const note=phase==='draw'?(manual(painter)?'Draw '+word[0]:'Watch the sketch. Guess when your seat lights up.'):phase==='guess'?(word[0].split(' ').length+' word(s) · Guess '+(turn+1)+' of 7'):[...record.values()].filter(status=>status==='Correct').length+' correct guesses · Artist +'+artistPoints+' pts';
 const drawTools=drawToolPanel();
 const input=(guesser!==null&&manual(guesser))?`<form class="row"><input aria-label="Your guess" placeholder="Type your guess" maxlength="24" autocomplete="off" required><button class="primary">Guess</button>${button('skip','Pass')}</form>`:'';
 const next=phase==='result'?button('next',round===2?'See standings':'Next round','primary'):'';
 main.innerHTML=`<div class="match" data-sketch-phase="${phase}"><div class="matchbody"><div class="matchhead"><span class="tag">Round ${round+1} of 3</span><strong class="clock">${phase==='draw'&&!manual(painter)?'Drawing':phase==='guess'&&!manual(guesser)?'Guessing':''}</strong></div><h2>${lead}</h2><p class="description">${note}</p><div class="roundTrack" role="img" aria-label="Round ${round+1} of 3">${[0,1,2].map(i=>'<i class="'+(i<=round?'filled':'')+'"></i>').join('')}</div><canvas width="560" height="560" aria-label="Sketch pad"></canvas>${drawTools}${input}${(guesser!==null&&manual(guesser))?drawHintControls():''}${next}</div><section class="seats" aria-label="Eight players">${players.map(p=>{
  const on=(phase==='draw'&&p.id===painter)||p.id===guesser;
  return `<div class="seat ${on?'hot':''} ${record.get(p.id)==='Correct'?'hit':''}" ${on?'aria-current="true"':''}><span class="avatar roomFace" data-face="${p.id}" style="--tone:${palette[p.id]}">${localParty?p.id+1:p.name[0]}</span><b>${p.name}</b><small>${p.id===painter?'Artist':record.get(p.id)||p.score+' pts'}</small></div>`;
 }).join('')}</section></div>`;
 syncDrawTools();paint();
}
function paint(){
 const canvas=main.querySelector('canvas');if(!canvas)return;
 const ctx=canvas.getContext('2d');ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,280,280);
 ctx.lineWidth=5;ctx.lineCap=ctx.lineJoin='round';
 for(const {ink,points,width=5,erase=false} of strokes){
  ctx.lineWidth=width;ctx.globalCompositeOperation=erase?'destination-out':'source-over';
  const [x,y]=points[0];ctx.fillStyle=ctx.strokeStyle=erase?'#000':ink;ctx.beginPath();
  if(points.length===1){ctx.arc(x,y,width/2,0,Math.PI*2);ctx.fill();continue}
  ctx.moveTo(x,y);for(const pt of points.slice(1))ctx.lineTo(...pt);ctx.stroke();
 }
}
function bindCanvas(){
 const c=main.querySelector('canvas');
 const point=e=>{const r=c.getBoundingClientRect();return [280*(e.clientX-r.left)/r.width,280*(e.clientY-r.top)/r.height]};
 c.onpointerdown=e=>{if(active||!e.isPrimary||e.button!==0||!drawIsActive())return;c.setPointerCapture(e.pointerId);active={ink:pen,width:drawErasing?18:drawCanvasWidth,erase:drawErasing,points:[point(e)]};strokes.push(active);drawRedo=[];syncDrawTools();paint()};
 c.onpointermove=e=>{if(active&&e.isPrimary){active.points.push(point(e));paint()}};
 c.onpointerup=c.onpointercancel=c.onlostpointercapture=()=>{active=null};
}
let wordOptions=[],sketchCards=[];
function chooseSketch(){
 const pool=drawPack==='mix'?Object.values(drawPacks).flat():drawPacks[drawPack];
 const alternative=shuffled(pool.filter(item=>!words.some(entry=>entry[0]===item[0])))[0];
 wordOptions=shuffled(alternative?[word,alternative]:[word]);phase='pickWord';
 main.innerHTML='<div class="handOff drawDeal"><span class="tag">Artist · '+name(painter)+'</span><h1>Pick your word</h1><p>Your 45 seconds start when you pick.</p><div class="wordPair">'+wordOptions.map((option,i)=>button('choose'+i,option[0])).join('')+'</div></div>';
}
function passDevice(id,artist){
   ready();
   phase=artist?'passDraw':'passGuess';
   main.innerHTML='<div class="handOff"><div class="handoffFace roomFace" data-face="'+id+'"></div><span class="tag">Round '+(round+1)+' of 3</span><h1>Pass to '+name(id)+'</h1><p>'+(artist?'Keep the word private. Your 45 seconds start when you are ready.':'Look at the sketch and enter one guess. You have 12 seconds after tapping Ready.')+'</p>'+button('takeSeat',artist?'See word choices':'Ready to guess','primary')+'</div>';
  }
  function startGuess(){studioCue('turn');ready();phase='guess';ask()}
function ask(){
 ready();
 if(turn===order.length){phase='result';studioCue('reveal');render();
  const preview=document.createElement('canvas');preview.width=140;preview.height=140;
  preview.getContext('2d').drawImage(main.querySelector('canvas'),0,0,140,140);
  sketchCards[round]={image:preview.toDataURL(),title:word[0],by:name(painter),hits:[...record.values()].filter(s=>s==='Correct').length};return}
 const id=order[turn];if(localParty){roundHint=false;hintLeft=true;passDevice(id,false);return}render();
 if(id===0){clock(12,()=>answer('Time up'));return}
 // NPC scoring is a local simulation, with fewer correct guesses for a sparse sketch.
 const ink=strokes.filter(stroke=>!stroke.erase);
 const zones=new Set(ink.flatMap(stroke=>stroke.points.map(([x,y])=>Math.floor(x/35)+':'+Math.floor(y/35))));
 const clarity=Math.min(.87,zones.size*.042+Math.min(ink.length,6)*.035);
 scheduleDraw(()=>answer(Math.random()<clarity?'Correct':'Miss'),1050);
}
function answer(result){
 if(phase!=='guess')return;
 ready();const id=order[turn];record.set(id,result);
 if(result==='Correct'){
  players[id].score+=manual(id)&&roundHint?50:100;
  if(artistPoints<100){artistPoints+=20;players[painter].score+=20;}
 }
 turn++;ask();
}
function final(){
 phase='done';
 const ranking=players.slice().sort((a,b)=>b.score-a.score), first=ranking[0].score;
 const winners=ranking.filter(p=>p.score===first);
 main.innerHTML=`<span class="tag">Final standings · ${drawPackLabels[drawPack]}</span><h1>${winners.length===1?name(winners[0].id)+' wins':'Tie for first'}</h1><div class="sketchGallery">${sketchCards.map(card=>'<figure><img alt="" src="'+card.image+'"><figcaption><b>'+card.title+'</b><small>'+card.by+' · '+card.hits+'/7</small></figcaption></figure>').join('')}</div><div class="stack">${ranking.map(p=>`<div class="result ranking"><span class="avatar roomFace" data-face="${p.id}" style="--tone:${palette[p.id]}">${localParty?p.id+1:p.name[0]}</span><b>${p.name}</b><strong>${p.score} pts</strong></div>`).join('')}${button('begin','Play again','primary')}${button('home','Change word pack')}</div>`;
}
const normalize=s=>s.trim().replace(/[\s，。！？,.!?]/g,'').toLowerCase();
main.addEventListener('submit',e=>{
 e.preventDefault();if(!drawIsActive()||phase!=='guess'||!manual(order[turn]))return;
 const value=normalize(e.target.querySelector('input').value);if(!value)return;
 if(Date.now()>=deadline){answer('Time up');return}
 answer([word[0],...(word[2]||'').split('|')].some(w=>w&&value===normalize(w))?'Correct':'Miss');
});
main.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a;
 if(phase==='pickWord'&&/^choose[01]$/.test(a)){
   const picked=wordOptions[Number(a.slice(-1))];if(!picked)return;
   word=words[round]=picked;wordOptions=[];phase='draw';drawSwapped=true;render();bindCanvas();clock(45,startGuess);return
  }
  if(phase==='home'&&(a==='localRoom'||a==='soloRoom')){localParty=a==='localRoom';home();return}
   if(a==='takeSeat'&&localParty&&(phase==='passDraw'||phase==='passGuess')){
    const drawing=phase==='passDraw';if(drawing){chooseSketch();return}phase='guess';render();
    clock(12,()=>answer('Time up'));
    return;
   }
   if(phase==='home'&&a.startsWith('pack-')&&Object.hasOwn(drawPackLabels,a.slice(5))){drawPack=a.slice(5);home();return}
 if(a==='pointHint'){useDrawHint();return}
 if(a==='begin')start();else if(a==='home')home();else if(a==='next'&&phase==='result'){round++;nextRound()}
 else if(a==='skip'&&phase==='guess'&&manual(order[turn]))answer('Pass');
 else if(phase==='draw'&&manual(painter))changeDrawTool(a);
});
home();
